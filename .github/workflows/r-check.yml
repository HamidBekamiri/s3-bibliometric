name: R package

on: [push, pull_request]

jobs:
  r-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # the R package runs the Python library from this checkout, so both are tested together
      - run: uv venv && uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install -e .
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages("reticulate")'
      - run: R CMD build r
      - run: R CMD check --no-manual s3bibliometric_*.tar.gz
        env:
          RETICULATE_PYTHON: ${{ github.workspace }}/.venv/bin/python
          _R_CHECK_CRAN_INCOMING_: false
      - if: failure()
        run: cat s3bibliometric.Rcheck/tests/*.Rout* || true
